text: "Das TI-Flow-FdV MUSS, wenn es Abrechnungsinformationen für PKV-Versicherte\
  \ unterstützt, die Anwendungsfälle\n <ul>\n <li>UC 3.14 - Einwilligung durch Versicherten\
  \ erteilen</li>\n <li>UC 3.15 - Einwilligung durch Versicherten widerrufen</li>\n\
  \ <li>UC 3.13 - Einwilligungen durch Versicherten einsehen</li>\n <li>UC 3.10 -\
  \ Abrechnungsinformationen durch Versicherten abrufen</li>\n <li>Abrechnungsinformationen\
  \ durch den Versicherten weitergeben</li>\n <li>UC 3.12 - Abrechnungsinformationen\
  \ durch den Versicherten markieren</li>\n <li>UC 3.11 - Abrechnungsinformationen\
  \ durch den Versicherten löschen</li>\n <li>Berechtigen der Apotheke zum Ändern\
  \ des PKV-Abgabedatensatzes</li>\n </ul>\n umsetzen."
