text: "Der TI-Flow-Fachdienst MUSS beim Aufruf des Endpunkts `POST /Consent` unter\
  \ den benannten Prüfbedingungen die folgende Profilvalidierung durchführen:\n\n\
  \  <table>\n    <thead>\n      <tr>\n        <th>Prüfbedingung</th>\n        <th>Profil</th>\n\
  \      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td>Rolle: oid_versicherter</td>\n\
  \        <td><code>https://gematik.de/fhir/erp/StructureDefinition/GEM_ERPCHRG_PR_Consent</code></td>\n\
  \      </tr>\n    </tbody>\n  </table>\n\nund bei negativem Prüfergebnis die Operation\
  \ mit dem folgenden Fehler abbrechen:\n\n<table id=\"error-code\" style=\"border:\
  \ 1px solid black; border-collapse: collapse;\">\n        <tr>\n            <th>HTTP-Code</th>\n\
  \            <td>400 - Bad Request</td>\n        </tr>\n        <tr>\n         \
  \   <th>Severity</th>\n            <td>error</td>\n        </tr>\n        <tr>\n\
  \            <th>Code</th>\n            <td>invalid</td>\n        </tr>\n      \
  \  <tr>\n            <th>Details Code</th>\n            <td>SVC_VALIDATION_FAILED</td>\n\
  \        </tr>\n        <tr>\n            <th>Details Text</th>\n            <td>FHIR\
  \ Profile validation failed</td>\n        </tr>\n    </table>"
