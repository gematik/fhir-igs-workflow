text: "Der TI-Flow-Fachdienst MUSS beim Löschen eines Tasks mit Flowtype 162 mittels\
  \ HTTP-POST/$abort-Operation auf den in der URL referenzierten/Task/&#60;id&#62;\
  \ die zeta-user-info.professionOID des Nutzers bestimmen und sicherstellen, dass\
  \ ausschließlich Nutzer in der Rolle\n    <ul>\n        <li>oid_versicherter</li>\n\
  \        <li>oid_praxis_arzt</li>\n        <li>oid_zahnarztpraxis</li>\n       \
  \ <li>oid_krankenhaus</li>\n        <li>oid_praxis_psychotherapeut</li>\n      \
  \  <li>oid_institution-vorsorge-reha</li>\n    </ul>\n    die Operation am Fachdienst\
  \ aufrufen, und bei Abweichungen die Operation mit dem folgenden Fehler:\n     \
  \       <table id=\"error-code\" style=\"border: 1px solid black; border-collapse:\
  \ collapse;\">\n                <tr><th>HTTP-Code</th><td>403 - Forbidden</td></tr>\n\
  \                <tr><th>Severity</th><td>error</td></tr>\n                <tr><th>Code</th><td>invalid</td></tr>\n\
  \                <tr><th>Details Code</th><td>-</td></tr>\n                <tr><th>Details\
  \ Text</th><td>-</td></tr>\n        </table>\n        abbrechen, damit die Verordnung\
  \ nicht durch einen Unberechtigten gelöscht werden kann."
title: TI-Flow-Fachdienst - E-Rezept löschen - Flowtype 162 - Rollenprüfung
