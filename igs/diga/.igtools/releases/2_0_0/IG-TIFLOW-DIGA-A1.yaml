text: "Der TI-Flow-Fachdienst MUSS beim Zurückweisen eines Tasks mit Flowtype 162\
  \ HTTP-POST-Operation über /Task/&lt;id&gt;/$reject die zeta-user-info.professionOID\
  \ des Nutzers bestimmen und sicherstellen, dass ausschließlich Nutzer in der Rolle\n\
  \    <ul><li>oid_kostentraeger</li></ul>\n    die Operation am Fachdienst aufrufen,\
  \ und bei Abweichungen die Operation mit dem folgenden Fehler:\n            <table\
  \ id=\"error-code\" style=\"border: 1px solid black; border-collapse: collapse;\"\
  >\n                <tr><th>HTTP-Code</th><td>403 - Forbidden</td></tr>\n       \
  \         <tr><th>Severity</th><td>error</td></tr>\n                <tr><th>Code</th><td>invalid</td></tr>\n\
  \                <tr><th>Details Code</th><td>-</td></tr>\n                <tr><th>Details\
  \ Text</th><td>-</td></tr>\n        </table>\n        abbrechen, damit die Verordnung\
  \ nicht durch einen Unberechtigten zurückgewiesen werden kann."
title: TI-Flow-Fachdienst - Task zurückweisen - Flowtype 162 - Rollenprüfung
