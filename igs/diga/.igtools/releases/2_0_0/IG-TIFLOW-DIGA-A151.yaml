text: "Der TI-Flow-Fachdienst MUSS das Löschen eines E-Rezepts über den mittels der\
  \ <id> adressierten /Task/<id>/$abort verhindern, wenn der Status des adressierten\
  \ Tasks in-progress ist und der aufrufende Nutzer der Versicherte ist,\n und die\
  \ Operation mit dem folgenden Fehler:\n <table id=\"error-code\" style=\"border:\
  \ 1px solid black; border-collapse: collapse;\">\n <tr>\n <th>HTTP-Code</th>\n <td>412\
  \ - Precondition Failed</td>\n </tr>\n <tr>\n <th>Severity</th>\n <td>error</td>\n\
  \ </tr>\n <tr>\n <th>Code</th>\n <td>invalid</td>\n </tr>\n <tr>\n <th>Details Code</th>\n\
  \ <td>TIFLOW_TASK_STATUS_MISMATCH</td>\n </tr>\n <tr>\n <th>Details Text</th>\n\
  \ <td>Task has invalid status.</td>\n </tr>\n </table> \n abbrechen, damit die Verordnung\
  \ nicht durch einen Unberechtigten gelöscht werden kann."
