text: "Der TI-Flow-Fachdienst MUSS beim Beenden eines Tasks mit Flowtype 162 mittels\
  \ HTTP-POST/$close-Operation auf den in der URL referenzierten/Task/&#60;id&#62;\
  \ sicherstellen, dass das in GEM_ERP_PR_PAR_CloseOperation_Input enthaltene MedicationDispense-Objekt\
  \ dem Profil GEM_ERP_PR_MedicationDispense_DiGA entspricht und anderenfalls die\
  \ Operation mit dem folgenden Fehler:\n    <table id=\"error-code\" style=\"border:\
  \ 1px solid black; border-collapse: collapse;\">\n                <tr><th>HTTP-Code</th><td>400\
  \ - Bad Request</td></tr>\n                <tr><th>Severity</th><td>error</td></tr>\n\
  \                <tr><th>Code</th><td>invalid</td></tr>\n                <tr><th>Details\
  \ Code</th><td>TIFLOW_MEDICATION_DISPENSE_INVALID</td></tr>\n                <tr><th>Details\
  \ Text</th><td>Unzulässige Abgabeinformationen: Für diesen Workflow sind nur Abgabeinformationen\
  \ für digitale Gesundheitsanwendungen zulässig.</td></tr>\n        </table>\n  \
  \      abbrechen."
title: TI-Flow-Fachdienst - Task schließen - Flowtype 162 - Profilprüfung MedicationDispense
