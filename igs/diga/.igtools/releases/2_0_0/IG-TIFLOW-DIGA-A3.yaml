text: "Der TI-Flow-Fachdienst MUSS beim Beenden eines Tasks mit Flowtype 162 mittels\
  \ HTTP-POST/$close-Operation auf den in der URL referenzierten/Task/&#60;id&#62;\
  \ die zeta-user-info.professionOID des Nutzers bestimmen und sicherstellen, dass\
  \ ausschließlich Nutzer in der Rolle\n    <ul><li>oid_kostentraeger</li></ul>\n\
  \    die Operation am Fachdienst aufrufen, und bei Abweichungen die Operation mit\
  \ dem folgenden Fehler:\n            <table id=\"error-code\" style=\"border: 1px\
  \ solid black; border-collapse: collapse;\">\n                <tr><th>HTTP-Code</th><td>403\
  \ - Forbidden</td></tr>\n                <tr><th>Severity</th><td>error</td></tr>\n\
  \                <tr><th>Code</th><td>invalid</td></tr>\n                <tr><th>Details\
  \ Code</th><td>-</td></tr>\n                <tr><th>Details Text</th><td>-</td></tr>\n\
  \        </table>\n        abbrechen, damit der Workflow nicht durch einen Unberechtigten\
  \ abgeschlossen werden kann."
title: TI-Flow-Fachdienst - Task schliessen - Flowtype 162 - Rollenprüfung
