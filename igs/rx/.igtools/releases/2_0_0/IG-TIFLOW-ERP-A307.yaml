text: "Der TI-Flow-Fachdienst MUSS die Operation <i>E-Rezept Abgabe vollziehen</i>\
  \ gemäß der FHIR OperationDefinition <a href=\"./OperationDefinition-tiflow-rx-close-op.html\"\
  >TIFlowRXOPClose</a> ausführen. Die Verarbeitung und Validierung der Daten MUSS\
  \ entsprechend den in der OperationDefinition festgelegten Regeln und Strukturen\
  \ erfolgen und bei Abweichung die Operation mit folgendem Fehler abbrechen:\n <table\
  \ id=\"error-code\" style=\"border: 1px solid black; border-collapse: collapse;\"\
  >\n <tr>\n <th>HTTP-Code</th>\n <td>400 - Bad Request</td>\n </tr>\n <tr>\n <th>Severity</th>\n\
  \ <td>error</td>\n </tr>\n <tr>\n <th>Code</th>\n <td>invalid</td>\n </tr>\n <tr>\n\
  \ <th>Details Code</th>\n <td>SVC_VALIDATION_FAILED</td>\n </tr>\n <tr>\n <th>Details\
  \ Text</th>\n <td>FHIR Profile validation failed.</td>\n </tr>\n </table>"
