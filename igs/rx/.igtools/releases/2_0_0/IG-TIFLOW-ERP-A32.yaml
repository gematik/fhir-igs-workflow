text: "Das TI-Flow-FdV MUSS im Anwendungsfall \"E-Rezept einer Apotheke zuweisen\"\
  \ eine FHIR Ressource Communication des Profils https://gematik.de/fhir/erp/StructureDefinition/GEM_ERP_PR_Communication_DispReq\
  \ mit \n <ul>\n <li>Telematik-ID der ausgewählten abgebenden LEI in recipient</li>\n\
  \ <li>Textnachricht in payload contentString</li>\n <li>E-Rezept-Token in basedOn\
  \ reference auf Task inkl. AccessCode als \"/Task/&lt;id&gt;/$accept?ac=...\" </li>\n\
  \ </ul>\n erstellen."
