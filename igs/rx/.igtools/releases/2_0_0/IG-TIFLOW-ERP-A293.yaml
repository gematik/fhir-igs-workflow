text: "Der TI-Flow-Fachdienst MUSS eine gespeicherte Ressource Communication\n\tautomatisch\
  \ löschen:\n\t<ul>\n\t\t<li>ohne eine Referenz auf einen Task in Communication.basedOn\
  \ nach 100 Tagen ab ihrem Sendedatum Communication.sent,</li>\n\t\t<li>mit einer\
  \ Referenz auf einen Task mit Flowtype 160, 166, 169, 200 oder 209 in Communication.basedOn\
  \ gemäß der Löschfrist beim Löschen des Tasks,</li>\n\t\t<li>mit einer Referenz\
  \ auf einen ChargeItem in Communication.basedOn nach 100 Tagen ab ihrem Sendedatum\
  \ Communication.sent.</li>\n\t</ul>"
