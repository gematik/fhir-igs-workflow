text: "Der TI-Flow-Fachdienst MUSS einen Task mit Flowtype 160, 166, 169, 200 oder\
  \ 209 nach Ablauf der Löschfrist gemäß der folgenden Festlegung automatisch löschen\
  \ und das Löschen in einem AuditEvent für den Versicherten nachvollziehbar protokollieren.\n\
  \t<table>\n\t\t<tr> \n\t\t<th>Task.status nach Statuswechsel</th>\n\t\t<th>Löschfrist</th>\n\
  \t\t</tr>\n\t\t<tr> \n\t\t<td>draft</td>\n\t\t<td>10 Tage nach Statuswechsel</td>\n\
  \t\t</tr>\n\t\t<tr> \n\t\t<td>ready</td>\n\t\t<td>10 Tage nach Datum in Task.expiryDate</td>\n\
  \t\t</tr>\n\t\t<tr> \n\t\t<td>in-progress</td>\n\t\t<td>100 Tage nach Statuswechsel</td>\n\
  \t\t</tr>\n\t\t<tr> \n\t\t<td>completed</td>\n\t\t<td>100 Tage nach Statuswechsel</td>\n\
  \t\t</tr>\n\t\t<tr> \n\t\t<td>cancelled</td>\n\t\t<td>10 Tage nach Statuswechsel</td>\n\
  \t\t</tr>\n\t</table>"
