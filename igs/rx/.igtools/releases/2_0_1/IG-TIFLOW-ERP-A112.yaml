text: "Das PS der verordnenden LEI MUSS bei Versand einer Zuweisungs-Message eine\
  \ Message mit \"Content-Type: multipart/mixed;...\" und der folgenden Struktur verwenden.\n\
  \ <table>\n <thead>\n <tr>\n <th>Teil</th>\n <th>Inhalt</th>\n <th>optional</th>\n\
  \ </tr>\n </thead>\n <tbody>\n <tr>\n <td>Freitext</td>\n <td>Freitextmessage für\
  \ den Empfänger<br>default: \"direkte Zuweisung E-Rezept\"</td>\n <td>nein</td>\n\
  \ </tr>\n <tr>\n <td>Einlöseinformation</td>\n <td>E-Rezept-Token als Link<br>Nach\
  \ 45 Zeichen MUSS ein Steuerzeichen \"CRLF\" eingefügt werden</td>\n <td>nein</td>\n\
  \ </tr>\n <tr>\n <td>Therapieplan</td>\n <td>Therapieplan als Anhang, base64 codiert</td>\n\
  \ <td>ja</td>\n </tr>\n </tbody>\n </table>\n <div><figcaption><strong>Tabelle:\
  \ </strong>Struktur der Message mit \"Content-Type: multipart/mixed;...\"</figcaption></div>"
title: E-Rezept - Struktur Zuweisungs-Message
