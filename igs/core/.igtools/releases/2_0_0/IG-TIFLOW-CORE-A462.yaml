text: Das Clientsystem des TI-Flow-Fachdienst MUSS im Fall, dass die WebSocket-Verbindung
  zu einem Subscription-Endpunkt unerwartet terminiert wird, vor dem Aufbau einer
  neuen WebSocket-Verbindung eine zufällig gewählte Wartezeit zwischen 5 und 60 Sekunden
  warten, bis eine neue Verbindung aufgebaut wird.
