text: "Der TI-Flow-Fachdienst MUSS bei der Validierung einer FHIR-Ressource prüfen,\
  \ ob angegebene Referenzen nach [FHIR Spezifikation Auflösen von Referenzen in Bundles]\
  \ ermittelt werden können und bei Abweichung die Operation mit dem folgenden Fehler:\n\
  \ <table id=\"error-code\" style=\"border: 1px solid black; border-collapse: collapse;\"\
  >\n <tr>\n <th>HTTP-Code</th>\n <td>400 - Bad Request</td>\n </tr>\n <tr>\n <th>Severity</th>\n\
  \ <td>error</td>\n </tr>\n <tr>\n <th>Code</th>\n <td>invalid</td>\n </tr>\n <tr>\n\
  \ <th>Details Code</th>\n <td>SVC_VALIDATION_FAILED</td>\n </tr>\n <tr>\n <th>Details\
  \ Text</th>\n <td>Reference to a resource could not be resolved</td>\n </tr>\n </table>\
  \ \n abbrechen."
title: FHIR-Ressource validieren - Prüfung Auflösbarkeit von Referenzen
