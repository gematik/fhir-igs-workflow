text: Das Clientsystem des TI-Flow-Fachdienst MUSS bei der Verarbeitung eingehender
  Ressourcen berücksichtigen, dass jede Ressource zu einem `ping` führen kann, potentiell
  im Millisekundenbereich und eine Strategie implementieren, um eine Überlastung zu
  vermeiden (z.B. durch kurze Wartezeiten vor Abrufen), wobei zwischenzeitlich eingegangene
  Ressourcen bei nachfolgenden Abrufen gesammelt abgerufen werden können.
