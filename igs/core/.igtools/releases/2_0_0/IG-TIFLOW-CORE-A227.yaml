text: "Der TI-Flow-Fachdienst MUSS beim Erstellen einer Push Notifcation das Reference-Feld\
  \ des äußeren NotificationRequest-Objekts (notificationRequest.reference) in Abhängigkeit\
  \ von der ChannelId wie folgt befüllen:\n <table>\n <tr>\n <th>ChannelId</th>\n\
  \ <th>Identifier.Feld</th>\n </tr>\n <tr>\n <td>tiflow.communication.new</td>\n\
  \ <td>Identifier des zugehörigen Communication (Communication.id)</td>\n </tr>\n\
  \ <tr>\n <td>ungleich tiflow.communication.new</td>\n <td>Identifier des zugehörigen\
  \ Protokolleintrags (AuditEvent.id)</td>\n </tr>\n </table>"
