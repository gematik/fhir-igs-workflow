text: "Der TI-Flow-Fachdienst MUSS beim Erzeugen eines Tasks mittels HTTP-POST/$create-Operation\
  \ den Parameter workflowType (Workflow-Typ für die Verordneung) aus dem HTTP-Body\
  \ des POST-Requests entnehmen, als Attribut Task.extension:flowType des zu erstellenden\
  \ Tasks verwenden und bei Fehlen bzw. Nicht-Konformität des Parameters den Request\
  \ mit folgendem Fehler als unzulässig abweisen:\n \n <table id=\"error-code\" style=\"\
  border: 1px solid black; border-collapse: collapse;\">\n <tr>\n <th>HTTP-Code</th>\n\
  \ <td>400 - Bad Request</td>\n </tr>\n <tr>\n <th>Severity</th>\n <td>error</td>\n\
  \ </tr>\n <tr>\n <th>Code</th>\n <td>invalid</td>\n </tr>\n <tr>\n <th>Details Code</th>\n\
  \ <td>TIFLOW_FLOWTYPE_MISMATCH</td>\n </tr>\n <tr>\n <th>Details Text</th>\n <td>Flowtype\
  \ nicht zulässig.</td>\n </tr>\n </table>\n \n , damit auf Basis dieser Parameter\
  \ ausschließlich gültige Workflows gestartet werden können und dem Versicherten\
  \ bei Einsicht des Tasks der Weg in entweder eine Apotheke oder ein Sanitätshaus\
  \ oder eine andere zuständige Einrichtung gewiesen werden kann."
title: TI-Flow-Fachdienst - Task erzeugen - Parametrierung Task für Workflow-Typ
version: 0
