text: "Das TI-Flow-FdV, das PS der verordnenden LEI und das PS der abgebenden LEI\
  \ MÜSSEN eine Sammlung von einer und bis zu vier E-Rezept-Referenzen als Array in\
  \ JSON-Notation gemäß [JSON] der folgenden Form \n <ul>\n <li>2D-Code-Daten = {\
  \ \"urls\": [ \"E-Rezept 1\", \"E-Rezept 2\", \"E-Rezept 3\", \"E-Rezept 4\" ] }</li>\n\
  \ </ul>\n zusammenfassen, um daraus einen 2D-Code generieren bzw. diesen einscannen\
  \ zu können."
